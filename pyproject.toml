[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isorag"
version = "0.1.0"
description = "Production-grade, multi-tenant RAG engine with hard isolation, semantic caching, hybrid retrieval, and context pruning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "IsoRAG Core Engineering Team", email = "infra@isorag.internal" }
]
keywords = ["rag", "multi-tenant", "qdrant", "redis", "fastapi", "semantic-cache", "reranking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "redis[hiredis]>=5.0.3",
    "qdrant-client>=1.8.2",
    "fastembed>=0.2.6",
    "numpy>=1.26.4",
    "httpx>=0.27.0",
    "openai>=1.14.3",
    "FlagEmbedding>=1.2.10",
    "sentence-transformers>=2.6.1",
    "llmlingua>=0.2.2",
    "torch>=2.2.0",
    "rich>=13.7.1",
    "tenacity>=8.2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "fakeredis[lua]>=2.21.3",
]
benchmark = [
    "locust>=2.24.1",
    "ragas>=0.1.6",
    "datasets>=2.18.0",
    "langchain>=0.1.14",
    "langchain-community>=0.0.31",
]

[project.scripts]
isorag = "src.main:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

